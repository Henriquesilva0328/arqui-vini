spring.application.name=arquivini

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/arquivini_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:usuario_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:troque-esta-senha}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never

server.port=${SERVER_PORT:8080}
